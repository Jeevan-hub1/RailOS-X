---
# PostGIS StatefulSet — Single-instance PostGIS 15-3.4 for Digital Twin geospatial layer
#
# Architecture:
#   - Single pod (no HA replicas); this is a dedicated spatial DB, not the Patroni cluster.
#   - Image: postgis/postgis:15-3.4 (PostgreSQL 15 + PostGIS 3.4 pre-installed)
#   - 50 Gi PVC for spatial data (IR GIS track geometry + asset registry)
#   - postgres_exporter sidecar for Prometheus metrics (Req 17)
#
# Init container:
#   - Injects SPATIAL_USER_PASSWORD into PostgreSQL via SET LOCAL before init.sql runs.
#   - Sets ownership on /var/lib/postgresql/data.
#
# Security (Design §9.3):
#   - Non-root user: UID 999 (postgres in official images)
#   - allowPrivilegeEscalation: false
#   - capabilities dropped to ALL
#
# Liveness / readiness:
#   - Liveness:   pg_isready — confirms PostgreSQL process is accepting connections
#   - Readiness:  pg_isready on railos_spatial database — confirms spatial DB is up
#
# Satisfies:
#   - Design §7.1 Layer A/B: PostGIS stores IR GIS track geometry and asset registry
#   - Req 8 C1/C3/C4:        spatial backend for Digital Twin rendering
#   - Design §9.3:            restricted Pod Security profile
#   - Req 17:                 postgres_exporter Prometheus sidecar
#   - Req 39:                 non-root, no privilege escalation
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
  namespace: railos
  labels:
    app: postgis
    app.kubernetes.io/name: postgis
    app.kubernetes.io/component: spatial-database
    app.kubernetes.io/part-of: railos-pilot
    app.kubernetes.io/version: "15-3.4"
spec:
  serviceName: postgis-headless
  replicas: 1                         # single-instance dedicated spatial DB
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: postgis

  template:
    metadata:
      labels:
        app: postgis
        app.kubernetes.io/name: postgis
        app.kubernetes.io/component: spatial-database
        app.kubernetes.io/part-of: railos-pilot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"

    spec:
      # ─── Security Context ──────────────────────────────────────────────────
      # UID 999 = postgres in the official PostgreSQL Docker image
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999

      terminationGracePeriodSeconds: 60

      # ─── Init Container: fix PVC ownership ────────────────────────────────
      # The postgis image runs as postgres (UID 999). The PVC is provisioned with
      # root ownership; chown is required before PostgreSQL can write to it.
      # The init container temporarily runs as root (UID 0) for chown only.
      initContainers:
        - name: postgis-init-data-dir
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              echo "Setting ownership on /var/lib/postgresql/data ..."
              chown -R 999:999 /var/lib/postgresql/data
              echo "Ownership set."
          volumeMounts:
            - name: postgis-data
              mountPath: /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE"]

      # ─── Containers ────────────────────────────────────────────────────────
      containers:

        # ── 1. PostGIS ─────────────────────────────────────────────────────────
        - name: postgis
          # PostGIS 15-3.4: PostgreSQL 15 with PostGIS 3.4 extensions pre-installed.
          # Using a pinned digest in production is recommended; the tag is used here
          # to allow easy patch-version upgrades (e.g. 15-3.4.1).
          image: postgis/postgis:15-3.4
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP

          env:
            # ── PostgreSQL bootstrap env vars ────────────────────────────────
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgis-secrets
                  key: superuser-password
            # The default DB created on first start; init.sql will also create
            # railos_spatial separately.
            - name: POSTGRES_DB
              value: "postgres"
            # Point PostgreSQL at our tuned postgresql.conf
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=md5 --encoding=UTF8"
            # Mount location for init scripts executed on first start
            # (docker-entrypoint-initdb.d convention)
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"

            # ── Expose spatial user password to init.sh ──────────────────────
            # init.sh reads this directly from the process environment to avoid
            # hardcoding the password in SQL strings.
            - name: SPATIAL_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgis-secrets
                  key: spatial-user-password

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          # ── Liveness Probe ────────────────────────────────────────────────
          # pg_isready checks that PostgreSQL is accepting connections.
          # Fails only if the postgres process is deadlocked or crashed.
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -h
                - localhost
                - -p
                - "5432"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          # ── Readiness Probe ───────────────────────────────────────────────
          # Targets the railos_spatial database specifically.
          # Pod becomes ready only when the spatial DB is accessible.
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - railos_spatial
                - -h
                - localhost
                - -p
                - "5432"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # ── Startup Probe ─────────────────────────────────────────────────
          # Allows up to 10 × 30s = 5 minutes for first-time initialization
          # (PostGIS runs CREATE EXTENSION which can take time on cold start).
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -h
                - localhost
                - -p
                - "5432"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          volumeMounts:
            - name: postgis-data
              mountPath: /var/lib/postgresql/data
            # init.sh is executed by the image entrypoint on first start
            - name: postgis-init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            # Custom postgresql.conf — override image defaults with spatial tuning
            - name: postgis-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        # ── 2. postgres_exporter sidecar (Prometheus metrics) ───────────────
        # Exposes PostgreSQL metrics on :9187/metrics.
        # Satisfies Req 17 (observability) and Design §8 (Prometheus scraping).
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: pg-exporter
              containerPort: 9187
              protocol: TCP
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgis-exporter-secret
                  key: data-source-name
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "true"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: pg-exporter
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: pg-exporter
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534     # nobody

      # ─── Volumes ────────────────────────────────────────────────────────────
      volumes:
        - name: postgis-init-sql
          configMap:
            name: postgis-config
            items:
              - key: init.sh
                path: init.sh
                mode: 0755
        - name: postgis-config
          configMap:
            name: postgis-config
            items:
              - key: postgresql.conf
                path: postgresql.conf
        - name: tmp-dir
          emptyDir: {}

  # ─── VolumeClaimTemplates ──────────────────────────────────────────────────
  # 50 Gi for IR GIS corridor geometry (~1,452 km) + asset registry.
  # PostGIS LineString data for track geometry is compact; 50 Gi provides
  # significant headroom for GIS imports, indexes, and future growth.
  # Task 13.1 (GIS data import) will populate this volume.
  volumeClaimTemplates:
    - metadata:
        name: postgis-data
        labels:
          app: postgis
          app.kubernetes.io/part-of: railos-pilot
      spec:
        accessModes:
          - ReadWriteOnce
        # Replace 'standard' with your cluster's SSD-backed storage class.
        # Recommended: gp3 (AWS EKS), premium-rwo (GKE), managed-premium (AKS),
        #              rook-ceph-block or longhorn (on-prem).
        storageClassName: standard
        resources:
          requests:
            storage: 50Gi
