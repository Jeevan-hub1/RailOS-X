---
# PostGIS Secrets — Dedicated spatial database for Digital Twin geospatial layer
#
# IMPORTANT: Replace all REPLACE_WITH_* placeholder values before deploying.
# Generate strong passwords with:
#   openssl rand -base64 32
#
# Production: populate this Secret via HashiCorp Vault Agent Injector or the
# External Secrets Operator, referencing secret/railos/postgis/* in Vault (Req 37).
# Never commit real credentials to source control.
#
# This database is SEPARATE from the Patroni PostgreSQL cluster (Task 1.3).
# It is a dedicated single-instance PostGIS 15-3.4 deployment for spatial queries
# serving the Digital Twin (Design §7.1 Layers A and B).
#
# Satisfies:
#   - Design §7.1 Layer A: asset_registry spatial columns
#   - Design §7.1 Layer B: PostGIS geospatial query backend
#   - Design §9.3:         non-root restricted security context
#   - Req 39:              credentials not embedded in manifests
apiVersion: v1
kind: Secret
metadata:
  name: postgis-secrets
  namespace: railos
  labels:
    app: postgis
    app.kubernetes.io/name: postgis
    app.kubernetes.io/component: spatial-database
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
stringData:
  # PostgreSQL superuser (postgres) password
  # Replace with a strong, randomly generated value before deploying.
  superuser-password: "REPLACE_WITH_POSTGIS_SUPERUSER_PASSWORD"

  # railos_spatial application user password
  # Used by Digital Twin services to connect to the spatial database.
  # Replace with a strong, randomly generated value before deploying.
  spatial-user-password: "REPLACE_WITH_RAILOS_SPATIAL_USER_PASSWORD"

---
# postgres_exporter credentials for Prometheus scraping
apiVersion: v1
kind: Secret
metadata:
  name: postgis-exporter-secret
  namespace: railos
  labels:
    app: postgis
    app.kubernetes.io/name: postgis
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
stringData:
  # DATA_SOURCE_NAME for prometheus/postgres_exporter sidecar.
  # Format: postgresql://<user>:<password>@localhost:5432/railos_spatial?sslmode=disable
  # Replace REPLACE_WITH_RAILOS_SPATIAL_USER_PASSWORD with the value above.
  data-source-name: "postgresql://railos_spatial:REPLACE_WITH_RAILOS_SPATIAL_USER_PASSWORD@localhost:5432/railos_spatial?sslmode=disable"
