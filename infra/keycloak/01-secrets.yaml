---
# Keycloak Secrets
#
# Contains:
#   1. keycloak-admin-secret  — Keycloak admin console credentials
#   2. keycloak-db-secret     — PostgreSQL database password for the keycloak DB user
#
# IMPORTANT: Replace ALL base64 placeholder values before deploying.
# Generate with:
#   echo -n 'your-strong-password' | base64
#
# For production use HashiCorp Vault (Req 37) with the Vault Agent Injector
# or External Secrets Operator instead of storing secrets in this file.
#
# Satisfies:
#   - Design §9.1:  Keycloak IdP for RBAC + MFA
#   - Requirement 23/24:  Authenticated API gateway (Kong → Keycloak RS256 JWT)
#   - Design §9.3:  Restricted security context; credentials never in env plain-text
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: railos
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
data:
  # Keycloak bootstrap admin username
  # Default placeholder: 'CHANGE_ME_admin' — MUST be replaced
  admin-user: Q0hBTkdFX01FX2FkbWlu

  # Keycloak bootstrap admin password — use a strong random value (≥32 chars)
  # Default placeholder: 'CHANGE_ME_admin_password' — MUST be replaced
  admin-password: Q0hBTkdFX01FX2FkbWluX3Bhc3N3b3Jk

---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: railos
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
data:
  # PostgreSQL username for the Keycloak database
  # Default placeholder: 'CHANGE_ME_keycloak_user' — MUST be replaced
  db-user: Q0hBTkdFX01FX2tleWNsb2FrX3VzZXI=

  # PostgreSQL password for the Keycloak database user
  # Default placeholder: 'CHANGE_ME_keycloak_db_pass' — MUST be replaced
  db-password: Q0hBTkdFX01FX2tleWNsb2FrX2RiX3Bhc3M=
