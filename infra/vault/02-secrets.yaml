---
# HashiCorp Vault — Secrets Template (Dev / Bootstrap Placeholders)
#
# IMPORTANT: These are placeholder values for initial bootstrap and development.
# In production:
#   - Do NOT use a hardcoded root token.
#   - Use auto-unseal (AWS KMS / GCP Cloud KMS / Azure Key Vault / Transit seal)
#     so the unseal key is never stored in Kubernetes Secrets.
#   - The root token should be revoked after initial setup and replaced with
#     appropriately-scoped AppRole or Kubernetes auth tokens.
#
# Replace all REPLACE_WITH_* values before deploying to any non-ephemeral environment.
#
# Satisfies:
#   - Req 37:   Vault credentials not hardcoded in application manifests
#   - Req 39:   Credentials not embedded in container image or ConfigMap
apiVersion: v1
kind: Secret
metadata:
  name: vault-bootstrap
  namespace: railos
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
stringData:
  # Root token — used ONLY for initial setup by the init Job.
  # Revoke immediately after bootstrap is complete.
  # Production: use Vault operator init output and store in a secure OOB location.
  VAULT_DEV_ROOT_TOKEN_ID: "REPLACE_WITH_VAULT_ROOT_TOKEN_FOR_BOOTSTRAP_ONLY"

  # Unseal key — generated by `vault operator init` during first run.
  # In dev mode Vault auto-unseals; in production use auto-unseal or store
  # unseal keys securely offline (Shamir's secret sharing, minimum 3-of-5).
  VAULT_UNSEAL_KEY: "REPLACE_WITH_VAULT_UNSEAL_KEY_FROM_OPERATOR_INIT"

  # Kubernetes auth backend service account token
  # Used by the init Job to configure the Kubernetes auth method.
  VAULT_K8S_SA_TOKEN: "REPLACE_WITH_K8S_SERVICE_ACCOUNT_TOKEN_FOR_VAULT_AUTH"
