---
# MinIO Credentials Secret — Template
#
# Replace all REPLACE_WITH_* values before deploying.
#
# Production note: In production, populate this Secret via HashiCorp Vault Agent
# Injector or External Secrets Operator, pointing at secret/railos/minio/* in Vault.
# Do NOT commit real credentials to source control.
#
# Satisfies:
#   - Design §9.5:   MinIO Object Lock WORM credentials
#   - Req 39:        Credentials not embedded in manifests
apiVersion: v1
kind: Secret
metadata:
  name: minio-auth
  namespace: railos
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
stringData:
  # Root access credentials — change before deploying
  MINIO_ROOT_USER: "REPLACE_WITH_MINIO_ROOT_USER"
  MINIO_ROOT_PASSWORD: "REPLACE_WITH_MINIO_ROOT_PASSWORD_MIN_8_CHARS"

  # Prometheus metrics bearer token (generate with: openssl rand -hex 32)
  MINIO_PROMETHEUS_AUTH_TOKEN: "REPLACE_WITH_PROMETHEUS_AUTH_TOKEN"

  # Service account key for bucket-init Job mc client
  MINIO_INIT_ACCESS_KEY: "REPLACE_WITH_INIT_ACCESS_KEY"
  MINIO_INIT_SECRET_KEY: "REPLACE_WITH_INIT_SECRET_KEY_MIN_8_CHARS"
