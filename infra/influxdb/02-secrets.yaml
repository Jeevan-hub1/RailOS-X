---
# InfluxDB Secrets — operator token and admin credentials
#
# IMPORTANT: Replace all placeholder values before deploying to production.
# In production, secrets should be injected from HashiCorp Vault via the
# Vault Agent Injector (sidecar) or External Secrets Operator, NOT stored
# in plaintext YAML. This file is provided as a reference/bootstrap template.
#
# Satisfies:
#   - Requirement 37:  All credentials stored in HashiCorp Vault (production path)
#   - Requirement 39:  Secrets not hardcoded in container images or ConfigMaps
#
# The values below are base64-encoded placeholders. Generate real values with:
#   echo -n "$(openssl rand -hex 32)" | base64
apiVersion: v1
kind: Secret
metadata:
  name: influxdb-auth
  namespace: railos
  labels:
    app: influxdb
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: time-series-store
    app.kubernetes.io/part-of: railos-pilot
  annotations:
    # In production, this secret is managed by External Secrets Operator:
    # externalsecrets.io/vault-path: "secret/railos/influxdb/auth"
    description: "InfluxDB admin credentials and operator API token"
type: Opaque
stringData:
  # InfluxDB initial admin username (bootstrap only)
  INFLUXDB_INIT_USERNAME: "railos-admin"

  # REPLACE: strong random password (min 16 chars)
  # Production: pulled from Vault path secret/railos/influxdb/admin-password
  INFLUXDB_INIT_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"

  # REPLACE: operator token used by all RailOS services to write/read
  # Production: pulled from Vault path secret/railos/influxdb/operator-token
  # Generate with: openssl rand -hex 32
  INFLUXDB_INIT_ADMIN_TOKEN: "REPLACE_WITH_OPERATOR_TOKEN_HEX_32_CHARS"

  # Initial organisation name
  INFLUXDB_INIT_ORG: "railos-pilot"

  # Initial bucket created at bootstrap (additional buckets added by setup Job)
  INFLUXDB_INIT_BUCKET: "sensor_events"

  # WAL replication shared secret — must match on both primary and standby
  # Production: pulled from Vault path secret/railos/influxdb/replication-secret
  INFLUXDB_REPLICATION_SECRET: "REPLACE_WITH_REPLICATION_SECRET_HEX_32_CHARS"
