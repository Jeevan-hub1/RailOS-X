---
# PostgreSQL / Patroni secrets
#
# IMPORTANT: Replace all base64 placeholder values before deploying.
# Generate secrets with:
#   echo -n 'your-strong-password' | base64
#
# For production use HashiCorp Vault (Req 37) with the Vault Agent Injector
# or External Secrets Operator instead of storing secrets in this file.
#
# Satisfies:
#   - Requirement 9  C7:  audit log security
#   - Requirement 15/16:  HA cluster credentials
#   - Design §9.3:        non-root, restricted security context
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-patroni-secrets
  namespace: railos
  labels:
    app: postgresql-patroni
    app.kubernetes.io/name: postgresql-patroni
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
data:
  # Superuser password for the 'postgres' role
  # Default placeholder: 'CHANGE_ME_superuser_pass' — MUST be replaced
  superuser-password: Q0hBTkdFX01FX3N1cGVydXNlcl9wYXNz

  # Replication user password (for streaming replication between nodes)
  # Default placeholder: 'CHANGE_ME_replication_pass'
  replication-password: Q0hBTkdFX01FX3JlcGxpY2F0aW9uX3Bhc3M=

  # Patroni REST API password (used for health checks and failover commands)
  # Default placeholder: 'CHANGE_ME_patroni_api_pass'
  patroni-api-password: Q0hBTkdFX01FX3BhdHJvbmlfYXBpX3Bhc3M=

  # Application user password (used by RailOS services to connect to databases)
  # Default placeholder: 'CHANGE_ME_app_pass'
  app-password: Q0hBTkdFX01FX2FwcF9wYXNz

---
# postgres_exporter credentials (Prometheus metrics scraping)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-exporter-secret
  namespace: railos
  labels:
    app: postgresql-patroni
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
data:
  # DATA_SOURCE_NAME for postgres_exporter
  # Format: postgresql://exporter:password@localhost:5432/postgres?sslmode=disable
  # Default placeholder value — MUST be replaced
  data-source-name: cG9zdGdyZXNxbDovL2V4cG9ydGVyOkNIQU5HRV9NRUBsb2NhbGhvc3Q6NTQzMi9wb3N0Z3Jlcz9zc2xtb2RlPWRpc2FibGU=
