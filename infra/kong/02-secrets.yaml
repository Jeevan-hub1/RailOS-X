---
# Kong API Gateway — Secrets Template
#
# Replace all REPLACE_WITH_* values before deploying.
#
# Production note: In production, populate this Secret via HashiCorp Vault Agent
# Injector or External Secrets Operator, pointing at secret/railos/kong/* in Vault.
# Do NOT commit real credentials to source control.
#
# Satisfies:
#   - Design §9.2:  Kong JWT plugin requires a shared secret for consumer JWT credentials
#   - Req 39:       Credentials not embedded in manifests
#   - Req 24:       API gateway authentication for all RailOS REST endpoints
apiVersion: v1
kind: Secret
metadata:
  name: kong-auth
  namespace: railos
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
stringData:
  # Kong Admin API JWT secret — used to authenticate requests to the Kong Admin API
  # (port 8001). Generate with: openssl rand -hex 32
  KONG_ADMIN_JWT_SECRET: "REPLACE_WITH_KONG_ADMIN_JWT_SECRET_HEX_32"

  # Keycloak JWKS endpoint (RS256 public key discovery)
  # This is not a secret but is kept here alongside auth config for clarity.
  # Value: http://keycloak.railos.svc.cluster.local:8080/realms/railos/protocol/openid-connect/certs
  KEYCLOAK_JWKS_URI: "http://keycloak.railos.svc.cluster.local:8080/realms/railos/protocol/openid-connect/certs"

  # OIDC issuer — must match the 'iss' claim in JWTs issued by Keycloak
  OIDC_ISSUER: "http://keycloak.railos.svc.cluster.local:8080/realms/railos"

  # Kong declarative config secret (DB-less mode integrity check)
  # Optional: set to a random value to prevent unauthorized config reloads
  KONG_DECLARATIVE_CONFIG_SECRET: "REPLACE_WITH_KONG_DECLARATIVE_CONFIG_SECRET"
