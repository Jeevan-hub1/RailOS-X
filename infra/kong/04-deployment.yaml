---
# Kong API Gateway 3.6 — Deployment (DB-less mode)
#
# Runs Kong in DB-less (declarative config) mode.  The kong.yml declarative
# config is mounted from the kong-declarative-config ConfigMap.  No PostgreSQL
# or Cassandra dependency is needed.
#
# Replicas: 2 — ensures availability during rolling updates and node failures.
# Non-root: runs as UID 1000 (kong user) — satisfies Req 39 restricted profile.
#
# Satisfies:
#   - Design §9.2:  Kong 3.x API Gateway, JWT RS256, rate-limiting, versioned routing
#   - Req 24:       API gateway for all RailOS REST endpoints
#   - Req 39:       Non-root security context, no privilege escalation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: railos
  labels:
    app: kong
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: railos-pilot
    app.kubernetes.io/version: "3.6"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # Zero-downtime rolling updates
  template:
    metadata:
      labels:
        app: kong
        app.kubernetes.io/name: kong
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/part-of: railos-pilot
      annotations:
        # Prometheus scrape the metrics endpoint exposed by the prometheus plugin
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
        # Force pod restart when ConfigMap changes (declarative config reload)
        checksum/config: "{{ include (print .Template.BasePath '/01-configmap.yaml') . | sha256sum }}"

    spec:
      # ─── Security Context ────────────────────────────────────────────────────
      # Restricted Pod Security Admission profile (Req 39 / Design §9.3)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # ─── Spread across nodes for availability ────────────────────────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: kong
                topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 30

      # ─── Init: wait for Keycloak JWKS endpoint to be reachable ───────────────
      # Kong's JWT plugin needs the JWKS URL at startup; if Keycloak is not yet
      # ready, Kong will start anyway but JWT validation will fail until JWKS is
      # loaded. This init container delays pod start until Keycloak is healthy.
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for Keycloak JWKS endpoint..."
              until wget -q -O /dev/null \
                "http://keycloak.railos.svc.cluster.local:8080/realms/railos/protocol/openid-connect/certs"; do
                echo "Keycloak not ready — retrying in 5s..."
                sleep 5
              done
              echo "Keycloak JWKS endpoint is reachable."
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      containers:
        - name: kong
          image: kong:3.6
          imagePullPolicy: IfNotPresent

          ports:
            - name: proxy-http
              containerPort: 8000
              protocol: TCP
            - name: proxy-https
              containerPort: 8443
              protocol: TCP
            - name: admin-http
              containerPort: 8001
              protocol: TCP
            - name: admin-https
              containerPort: 8444
              protocol: TCP

          env:
            # ── DB-less mode ──────────────────────────────────────────────────
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/kong/declarative/kong.yml"

            # ── Networking ───────────────────────────────────────────────────
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
            - name: KONG_PROXY_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_ADMIN_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_PROXY_ERROR_LOG
              value: "/dev/stderr"
            - name: KONG_ADMIN_ERROR_LOG
              value: "/dev/stderr"
            - name: KONG_LOG_LEVEL
              value: "info"

            # ── Plugins ──────────────────────────────────────────────────────
            - name: KONG_PLUGINS
              value: "bundled,jwt,rate-limiting,request-transformer,opentelemetry,prometheus"

            # ── JWT plugin: Keycloak JWKS URI ────────────────────────────────
            # Kong's jwt plugin in RS256 mode needs the JWK set.
            # The key is provisioned via the declarative config consumer JWT credentials.
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "2"

            # ── Tracing ──────────────────────────────────────────────────────
            - name: KONG_TRACING_INSTRUMENTATIONS
              value: "all"
            - name: KONG_TRACING_SAMPLING_RATE
              value: "1.0"

            # ── Admin API security ────────────────────────────────────────────
            - name: KONG_ADMIN_GUI_URL
              value: "http://kong-admin.railos.svc.cluster.local:8001"

            # ── Secret references ─────────────────────────────────────────────
            - name: KONG_ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kong-auth
                  key: KONG_ADMIN_JWT_SECRET

          # ─── Resources ────────────────────────────────────────────────────────
          # Sized to handle 1,000 req/min × 2 replicas with headroom.
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"

          # ─── Probes ───────────────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /status
              port: admin-http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /status
              port: admin-http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          startupProbe:
            httpGet:
              path: /status
              port: admin-http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24    # 2 minutes for cold start

          volumeMounts:
            - name: kong-config
              mountPath: /kong/declarative
              readOnly: true
            # Kong needs a writable /tmp for nginx temp files
            - name: kong-tmp
              mountPath: /tmp
            - name: kong-prefix
              mountPath: /var/run/kong

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false    # Kong/nginx writes pid files to prefix dir
            runAsNonRoot: true
            runAsUser: 1000

      # ─── Volumes ──────────────────────────────────────────────────────────────
      volumes:
        - name: kong-config
          configMap:
            name: kong-declarative-config
            items:
              - key: kong.yml
                path: kong.yml
        - name: kong-tmp
          emptyDir: {}
        - name: kong-prefix
          emptyDir: {}
