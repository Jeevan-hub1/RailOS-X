---
# PodDisruptionBudget — Flink JobManager
#
# Ensures at least 1 JobManager pod is available during voluntary disruptions
# (node drains, cluster upgrades). With replicas=1, this prevents the single JM
# from being evicted during a rolling node maintenance window.
#
# Satisfies:
#   - Requirement 15: HA availability — JM is not disrupted during node maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flink-jobmanager-pdb
  namespace: railos
  labels:
    app: flink
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: jobmanager
    app.kubernetes.io/part-of: railos-pilot
spec:
  maxUnavailable: 0    # Never allow the single JM to be disrupted voluntarily
  selector:
    matchLabels:
      app: flink
      component: jobmanager

---
# PodDisruptionBudget — Flink TaskManagers
#
# Ensures at most 1 of 3 TaskManagers is unavailable at a time.
# With 3 TMs and parallelism=12, losing 1 TM reduces available slots to 8.
# Flink will reschedule up to 4 affected tasks onto the remaining 2 TMs,
# maintaining job continuity at reduced throughput during maintenance.
#
# Satisfies:
#   - Requirement 1 C6: Sustained 10,000 events/s — degraded but not stopped
#   - Requirement 15:   HA — node drains don't kill the full stream processing job
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flink-taskmanager-pdb
  namespace: railos
  labels:
    app: flink
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: taskmanager
    app.kubernetes.io/part-of: railos-pilot
spec:
  maxUnavailable: 1    # At most 1 TM disrupted voluntarily (2 of 3 always available)
  selector:
    matchLabels:
      app: flink
      component: taskmanager
