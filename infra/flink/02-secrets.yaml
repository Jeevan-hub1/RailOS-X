---
# Flink Secrets — Kafka and InfluxDB connection credentials
#
# IMPORTANT: Replace all placeholder values before deploying to production.
# In production, use External Secrets Operator or Vault Agent Injector to
# pull secrets from HashiCorp Vault (Requirement 37).
#
# This file is committed without real values as a bootstrap reference only.
# Add it to .gitignore or use a secrets management tool in real deployments.
#
# Satisfies:
#   - Requirement 37: Credentials stored in HashiCorp Vault (production path)
#   - Requirement 39: Secrets not hardcoded in container images or ConfigMaps
apiVersion: v1
kind: Secret
metadata:
  name: flink-kafka-config
  namespace: railos
  labels:
    app: flink
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: stream-processor
    app.kubernetes.io/part-of: railos-pilot
  annotations:
    # Production: externalsecrets.io/vault-path: "secret/railos/flink/kafka"
    description: "Flink → Kafka connection parameters"
type: Opaque
stringData:
  # Internal cluster DNS for Kafka bootstrap (matches Strimzi service name)
  KAFKA_BOOTSTRAP_SERVERS: "railos-kafka-kafka-bootstrap.railos.svc.cluster.local:9092"

  # Consumer group ID for Flink Kafka sources
  KAFKA_CONSUMER_GROUP_ID: "railos-flink-stream-processor"

  # REPLACE in production: SASL/SCRAM or mTLS credentials
  # KAFKA_SASL_USERNAME: "REPLACE_WITH_KAFKA_USERNAME"
  # KAFKA_SASL_PASSWORD: "REPLACE_WITH_KAFKA_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: flink-influxdb-config
  namespace: railos
  labels:
    app: flink
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: stream-processor
    app.kubernetes.io/part-of: railos-pilot
  annotations:
    # Production: externalsecrets.io/vault-path: "secret/railos/flink/influxdb"
    description: "Flink → InfluxDB 3.0 write credentials"
type: Opaque
stringData:
  # InfluxDB 3.0 HTTP API endpoint (matches infra/influxdb service)
  INFLUXDB_URL: "http://influxdb.railos.svc.cluster.local:8086"

  # REPLACE: InfluxDB operator token (same token used by other services)
  # Production: pulled from Vault path secret/railos/influxdb/operator-token
  INFLUXDB_TOKEN: "REPLACE_WITH_INFLUXDB_OPERATOR_TOKEN"

  INFLUXDB_ORG: "railos-pilot"
  INFLUXDB_BUCKET: "sensor_events"

---
apiVersion: v1
kind: Secret
metadata:
  name: flink-deltalake-config
  namespace: railos
  labels:
    app: flink
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: stream-processor
    app.kubernetes.io/part-of: railos-pilot
  annotations:
    description: "Flink → Delta Lake (S3-compatible) write credentials"
type: Opaque
stringData:
  # S3-compatible endpoint (MinIO or AWS S3)
  DELTA_LAKE_S3_ENDPOINT: "http://minio.railos.svc.cluster.local:9000"

  # REPLACE: MinIO / S3 access credentials
  # Production: pulled from Vault path secret/railos/flink/deltalake
  DELTA_LAKE_ACCESS_KEY: "REPLACE_WITH_ACCESS_KEY"
  DELTA_LAKE_SECRET_KEY: "REPLACE_WITH_SECRET_KEY"

  # S3 bucket and prefix for Delta Lake tables
  DELTA_LAKE_BUCKET: "railos-delta-lake"
  DELTA_LAKE_PATH_PREFIX: "sensor_events"
