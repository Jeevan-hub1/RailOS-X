---
# MLflow Tracking Server — Secrets Template
#
# Replace all REPLACE_WITH_* values before deploying.
#
# Production note: In production, populate this Secret via HashiCorp Vault Agent
# Injector or External Secrets Operator, pointing at secret/railos/mlflow/* in Vault.
# Do NOT commit real credentials to source control.
#
# Satisfies:
#   - Req 11:       MLflow connects to PostgreSQL (tracking DB) and MinIO (artifacts)
#   - Req 39:       Credentials not embedded in manifests or container images
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secrets
  namespace: railos
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: ml-tracking
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
stringData:
  # ── PostgreSQL connection ─────────────────────────────────────────────────
  # MLflow uses PostgreSQL (Patroni cluster) as its tracking metadata backend.
  # Format: postgresql+psycopg2://user:password@host:port/database
  #
  # Patroni service: postgresql-primary.railos.svc.cluster.local:5432
  MLFLOW_BACKEND_STORE_URI: "postgresql+psycopg2://mlflow:REPLACE_WITH_MLFLOW_DB_PASSWORD@postgresql-primary.railos.svc.cluster.local:5432/mlflow"

  # PostgreSQL password for the mlflow database user (must match Patroni config)
  MLFLOW_DB_PASSWORD: "REPLACE_WITH_MLFLOW_DB_PASSWORD"

  # ── MinIO (S3-compatible artifact store) ─────────────────────────────────
  # MLflow artifact store: s3://railos-mlflow-artifacts
  # MinIO service: minio.railos.svc.cluster.local:9000
  MLFLOW_ARTIFACT_ROOT: "s3://railos-mlflow-artifacts"

  # MinIO access credentials for MLflow artifact writes
  # These should be a dedicated MLflow service account in MinIO, not the root user.
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_MINIO_MLFLOW_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_MINIO_MLFLOW_SECRET_KEY"
