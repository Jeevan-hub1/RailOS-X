---
# Prometheus ClusterIP Service on port 9090
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: railos-observability
  labels:
    app: prometheus
    component: observability
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
