---
# Grafana admin password — replace before deploy
# Generate: openssl rand -base64 24
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: railos
  labels:
    app: grafana
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
stringData:
  admin-password: "REPLACE_WITH_GRAFANA_ADMIN_PASSWORD_MIN_16_CHARS"
