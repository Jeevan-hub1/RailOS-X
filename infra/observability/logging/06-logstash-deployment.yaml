---
# Logstash 8.13 — Kafka → Elasticsearch log pipeline
# Satisfies: Req 17 (structured JSON logs), Design §8
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: railos
  labels:
    app: logstash
    app.kubernetes.io/name: logstash
    app.kubernetes.io/part-of: railos-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-elasticsearch
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://elasticsearch.railos.svc.cluster.local:9200/_cluster/health?wait_for_status=yellow&timeout=5s; do
                echo "Waiting for Elasticsearch..."; sleep 5
              done
              echo "Elasticsearch ready."
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.13.2
          imagePullPolicy: IfNotPresent
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - name: metrics
              containerPort: 9600
          resources:
            requests:
              cpu: "300m"
              memory: "1Gi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: logstash-config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
              readOnly: true
            - name: logstash-pipeline
              mountPath: /usr/share/logstash/pipeline/railos-pipeline.conf
              subPath: railos-pipeline.conf
              readOnly: true
            - name: logstash-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: logstash-config
          configMap:
            name: logstash-config
            items:
              - key: logstash.yml
                path: logstash.yml
        - name: logstash-pipeline
          configMap:
            name: logstash-config
            items:
              - key: railos-pipeline.conf
                path: railos-pipeline.conf
        - name: logstash-tmp
          emptyDir: {}
