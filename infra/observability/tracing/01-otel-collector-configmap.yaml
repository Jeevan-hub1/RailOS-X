---
# OpenTelemetry Collector Configuration
# Receives OTLP traces from all RailOS services, exports to Jaeger
# Satisfies: Req 17 (distributed tracing), Req 25 (e2e latency trace), Design §8
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: railos
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: railos-pilot
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      batch:
        timeout: 1s
        send_batch_size: 1024

    exporters:
      jaeger:
        endpoint: jaeger.railos.svc.cluster.local:14250
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: railos_otel
      logging:
        loglevel: warn

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [jaeger, logging]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]

      telemetry:
        metrics:
          address: 0.0.0.0:8888
