type: Opaque
stringData:
  PAGERDUTY_KEY: "REPLACE_WITH_PAGERDUTY_ROUTING_KEY"
  SMS_WEBHOOK_URL: "https://REPLACE_WITH_SMS_GATEWAY_URL/send"
