---
# Privilege Escalation Alert Handler Deployment (Task 17.4)
# Receives Falco JSON alerts via HTTP, emits PRIVILEGE_ESCALATION_ALERT to Kafka,
# and terminates offending containers within 30 seconds.
# Satisfies: Req 39 C3–C4
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-alert-handler
  namespace: railos
  labels:
    app: falco-alert-handler
    app.kubernetes.io/name: falco-alert-handler
    app.kubernetes.io/component: runtime-security
    app.kubernetes.io/part-of: railos-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falco-alert-handler
  template:
    metadata:
      labels:
        app: falco-alert-handler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: falco-handler
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: handler
          image: railos/falco-alert-handler:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
            - name: metrics
              containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: falco-handler-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: NAMESPACE
              value: "railos"
            - name: TERMINATE_TIMEOUT_SECONDS
              value: "30"
            - name: APP_PORT
              value: "8090"
            - name: METRICS_PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-handler-config
  namespace: railos
  labels:
    app.kubernetes.io/part-of: railos-pilot
data:
  KAFKA_BOOTSTRAP_SERVERS: "railos-kafka-kafka-bootstrap.railos.svc.cluster.local:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: falco-alert-handler
  namespace: railos
  labels:
    app: falco-alert-handler
    app.kubernetes.io/part-of: railos-pilot
spec:
  type: ClusterIP
  selector:
    app: falco-alert-handler
  ports:
    - name: http
      port: 8090
      targetPort: http
    - name: metrics
      port: 8080
      targetPort: metrics
---
# RBAC: handler needs kubectl delete pod permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-handler
  namespace: railos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-handler-role
  namespace: railos
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-handler-rolebinding
  namespace: railos
subjects:
  - kind: ServiceAccount
    name: falco-handler
    namespace: railos
roleRef:
  kind: Role
  name: falco-handler-role
  apiGroup: rbac.authorization.k8s.io
