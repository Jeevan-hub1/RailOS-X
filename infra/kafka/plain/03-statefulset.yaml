---
# Kafka StatefulSet — 3 brokers, RF=3, min.insync.replicas=2
#
# Satisfies:
#   - Requirement 1:  Kafka backbone for sensor data ingestion
#   - Requirement 15: RF=3 for disaster recovery
#   - Requirement 16: min.insync.replicas=2, RTO < 30s
#   - Design §10.1:   3 brokers, PVC-backed storage
#
# NOTE: This plain StatefulSet does NOT include ZooKeeper.
# Deploy ZooKeeper separately (e.g., Bitnami ZooKeeper chart or a separate StatefulSet)
# and update the zookeeper.connect in 01-configmap.yaml accordingly.
# The Strimzi approach (strimzi/ directory) is recommended for production as it
# manages ZooKeeper automatically.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: railos
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: railos-pilot
    app.kubernetes.io/version: "3.7.0"
spec:
  serviceName: kafka-headless
  replicas: 3                 # 3 brokers — matches RF=3 requirement
  updateStrategy:
    type: RollingUpdate       # Roll one broker at a time to maintain availability
  podManagementPolicy: OrderedReady  # Start brokers sequentially (0 → 1 → 2)
  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: railos-pilot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9404"

    spec:
      # ─── Security Context ────────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # ─── Anti-Affinity: spread brokers across different nodes ────────────────
      # This ensures that a single node failure does not take down more than one
      # broker, preserving min.insync.replicas=2.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - kafka
              topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 120

      # ─── Init Container: prepare broker config ───────────────────────────────
      initContainers:
        - name: kafka-config-init
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              BROKER_ID="${HOSTNAME##*-}"
              echo "Initialising broker config for broker.id=${BROKER_ID}"
              cp /etc/kafka-template/server.properties /etc/kafka-init/server.properties
              cat >> /etc/kafka-init/server.properties <<EOF
              broker.id=${BROKER_ID}
              listeners=PLAINTEXT://0.0.0.0:9092
              advertised.listeners=PLAINTEXT://${HOSTNAME}.kafka-headless.railos.svc.cluster.local:9092
              EOF
              echo "Config written:"
              cat /etc/kafka-init/server.properties
          volumeMounts:
            - name: kafka-config-template
              mountPath: /etc/kafka-template
            - name: kafka-config-init
              mountPath: /etc/kafka-init
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      # ─── Main Container ──────────────────────────────────────────────────────
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              exec /opt/kafka/bin/kafka-server-start.sh /etc/kafka-init/server.properties
          ports:
            - name: kafka
              containerPort: 9092
              protocol: TCP

          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xms2048m -Xmx4096m"
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: >-
                -server
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=20
                -XX:InitiatingHeapOccupancyPercent=35
                -XX:+ExplicitGCInvokesConcurrent
                -Djava.awt.headless=true

          # ─── Resources ────────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "1000m"      # 1 vCPU steady state
              memory: "4Gi"
            limits:
              cpu: "4000m"      # 4 vCPU burst for 10k events/sec (Req 1 C6)
              memory: "8Gi"

          # ─── Probes ───────────────────────────────────────────────────────────
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          # ─── Volume Mounts ────────────────────────────────────────────────────
          volumeMounts:
            - name: kafka-data
              mountPath: /var/kafka/data
            - name: kafka-config-init
              mountPath: /etc/kafka-init

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        # ─── JMX Prometheus Exporter Sidecar ──────────────────────────────────
        # Exposes Kafka JMX metrics as Prometheus /metrics endpoint on port 9404.
        # Scraped by Prometheus in the RailOS observability stack (Req 17, Req 25).
        - name: jmx-exporter
          image: bitnami/jmx-exporter:0.20.0
          imagePullPolicy: IfNotPresent
          args:
            - "9404"
            - /etc/jmx/jmx-exporter-config.yaml
          ports:
            - name: jmx-exporter
              containerPort: 9404
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: jmx-config
              mountPath: /etc/jmx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      # ─── Volumes ─────────────────────────────────────────────────────────────
      volumes:
        - name: kafka-config-template
          configMap:
            name: kafka-broker-config
            items:
              - key: server.properties
                path: server.properties
        - name: kafka-config-init
          emptyDir: {}
        - name: jmx-config
          configMap:
            name: kafka-jmx-exporter-config

  # ─── VolumeClaimTemplates ─────────────────────────────────────────────────────
  # Each broker gets its own 200 Gi PVC for Kafka log storage.
  # PVCs survive pod restarts and StatefulSet deletions (deleteClaim: false default).
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels:
          app: kafka
          app.kubernetes.io/part-of: railos-pilot
      spec:
        accessModes:
          - ReadWriteOnce
        # Replace 'standard' with your cluster's SSD-backed storage class.
        # Recommended: gp3 (AWS EKS), premium-rwo (GKE), managed-premium (AKS)
        storageClassName: standard
        resources:
          requests:
            storage: 200Gi

---
# JMX Exporter configuration for the sidecar
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-jmx-exporter-config
  namespace: railos
  labels:
    app: kafka
    app.kubernetes.io/part-of: railos-pilot
data:
  jmx-exporter-config.yaml: |
    hostPort: localhost:9999
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    whitelistObjectNames:
      - "kafka.server:type=BrokerTopicMetrics,*"
      - "kafka.server:type=ReplicaManager,*"
      - "kafka.controller:type=KafkaController,*"
      - "kafka.network:type=RequestMetrics,*"
      - "kafka.log:type=LogFlushStats,*"
    rules:
      - pattern: kafka.server<type=BrokerTopicMetrics, name=(MessagesInPerSec|BytesInPerSec|BytesOutPerSec), topic=(.+)><>(Count|OneMinuteRate)
        name: kafka_server_brokertopicmetrics_$1_$3
        labels:
          topic: $2
      - pattern: kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value
        name: kafka_server_replicamanager_underreplicatedpartitions
      - pattern: kafka.controller<type=KafkaController, name=ActiveControllerCount><>Value
        name: kafka_controller_activecontrollercount
      - pattern: kafka.controller<type=KafkaController, name=OfflinePartitionsCount><>Value
        name: kafka_controller_offlinepartitionscount
      - pattern: kafka.network<type=RequestMetrics, name=TotalTimeMs, request=(.+)><>(Mean|99thPercentile)
        name: kafka_network_requestmetrics_totaltimems_$2
        labels:
          request: $1
