---
# Kafka broker configuration — shared template for all 3 brokers.
# Each broker's unique settings (broker.id, listeners, advertised.listeners)
# are injected by the StatefulSet init container using the pod ordinal.
#
# Design §10.1: RF=3, min.insync.replicas=2, RTO < 30s
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-broker-config
  namespace: railos
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: railos-pilot
data:
  # Template — broker.id and listeners are set at runtime by the init container.
  # Variables prefixed with $$ are replaced by the entrypoint script.
  server.properties: |
    ########################
    # Broker Identity
    ########################
    # broker.id is set dynamically from the pod ordinal by the entrypoint
    # broker.id=$$BROKER_ID

    ########################
    # Listeners
    ########################
    # Set dynamically from pod hostname:
    # listeners=PLAINTEXT://0.0.0.0:9092
    # advertised.listeners=PLAINTEXT://kafka-$$BROKER_ID.kafka-headless.railos.svc.cluster.local:9092
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT

    ########################
    # ZooKeeper
    ########################
    zookeeper.connect=zookeeper-0.zookeeper-headless.railos.svc.cluster.local:2181,zookeeper-1.zookeeper-headless.railos.svc.cluster.local:2181,zookeeper-2.zookeeper-headless.railos.svc.cluster.local:2181
    zookeeper.connection.timeout.ms=18000

    ########################
    # Replication — Req 15 / 16 / Design §10.1
    ########################
    default.replication.factor=3
    min.insync.replicas=2
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    unclean.leader.election.enable=false
    replica.lag.time.max.ms=10000

    ########################
    # Log / Retention
    ########################
    log.dirs=/var/kafka/data
    num.partitions=3
    log.retention.hours=168
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000

    ########################
    # Network
    ########################
    num.network.threads=6
    num.io.threads=8
    socket.send.buffer.bytes=102400
    socket.receive.buffer.bytes=102400
    socket.request.max.bytes=104857600
    auto.create.topics.enable=false

    ########################
    # Compression
    ########################
    compression.type=lz4

    ########################
    # Controlled shutdown
    ########################
    controlled.shutdown.enable=true
    controlled.shutdown.max.retries=3
    controlled.shutdown.retry.backoff.ms=5000

  # Entrypoint script: injects dynamic broker.id and listener config
  # before launching Kafka.
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    # Derive broker ID from the pod ordinal (last character of hostname)
    BROKER_ID="${HOSTNAME##*-}"

    echo "Starting Kafka broker ${BROKER_ID}"

    # Copy base config and inject dynamic fields
    cp /etc/kafka/server.properties /tmp/server.properties

    cat >> /tmp/server.properties <<EOF
    broker.id=${BROKER_ID}
    listeners=PLAINTEXT://0.0.0.0:9092
    advertised.listeners=PLAINTEXT://${HOSTNAME}.kafka-headless.railos.svc.cluster.local:9092
    EOF

    exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
