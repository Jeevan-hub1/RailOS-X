---
# RailOS Kafka Cluster — Strimzi Kafka Custom Resource
#
# Satisfies:
#   - Requirement 1:  Kafka as message broker backbone for sensor data ingestion
#   - Requirement 15: Kafka RF=3 for disaster recovery
#   - Requirement 16: min.insync.replicas=2 for HA
#   - Design §10.1:   3 brokers, RF=3, min.insync.replicas=2, RTO < 30s
#
# Deployment:
#   kubectl apply -f 01-kafka-cluster.yaml -n railos
#
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: railos-kafka
  namespace: railos
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: railos-pilot
    app.kubernetes.io/version: "3.7.0"
    tier: "tier4-central-core"
spec:

  # ─── Kafka Brokers ────────────────────────────────────────────────────────────
  kafka:
    version: 3.7.0
    # 3 brokers: provides RF=3 with full redundancy; single broker loss does not
    # interrupt availability (min.insync.replicas=2 means 1 broker can be offline).
    replicas: 3

    image: quay.io/strimzi/kafka:0.40.0-kafka-3.7.0

    # ─── Listeners ──────────────────────────────────────────────────────────────
    listeners:
      # Plain (no TLS) listener — internal cluster traffic only
      - name: plain
        port: 9092
        type: internal
        tls: false
        configuration:
          # Restrict to railos namespace only
          brokerCertChainAndKey:
            secretName: railos-kafka-internal-cert  # populated by Strimzi if TLS enabled

      # TLS listener — for any client that requires encryption in transit
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls

    # ─── Broker Configuration ────────────────────────────────────────────────────
    config:
      # Replication defaults for auto-created topics
      default.replication.factor: "3"
      min.insync.replicas: "2"
      offsets.topic.replication.factor: "3"
      transaction.state.log.replication.factor: "3"
      transaction.state.log.min.isr: "2"

      # Retention: 7 days default (individual topics override via KafkaTopic CRs)
      log.retention.hours: "168"
      log.retention.bytes: "-1"
      log.segment.bytes: "1073741824"    # 1 GiB segments

      # Network / throughput tuning for 10k+ events/sec (Req 1 C6)
      num.network.threads: "6"
      num.io.threads: "8"
      socket.send.buffer.bytes: "102400"
      socket.receive.buffer.bytes: "102400"
      socket.request.max.bytes: "104857600"  # 100 MiB

      # Compression
      compression.type: "lz4"

      # Auto topic creation disabled — all topics managed via KafkaTopic CRs
      auto.create.topics.enable: "false"

      # Leader election / failover timing (drives RTO < 30s)
      unclean.leader.election.enable: "false"
      replica.lag.time.max.ms: "10000"
      controlled.shutdown.enable: "true"

      # Inter-broker protocol version (must match kafka.version)
      inter.broker.protocol.version: "3.7"
      log.message.format.version: "3.7"

    # ─── Storage ─────────────────────────────────────────────────────────────────
    storage:
      type: persistent-claim
      size: 200Gi
      # Replace 'standard' with your cluster's SSD-backed storage class.
      # Recommended: gp3 (AWS), premium-rwo (GKE), managed-premium (AKS), fast-ssd (on-prem)
      class: standard
      deleteClaim: false   # Retain PVCs on cluster delete to protect data

    # ─── Resources ───────────────────────────────────────────────────────────────
    resources:
      requests:
        cpu: "1000m"       # 1 vCPU per broker at steady state
        memory: "4Gi"
      limits:
        cpu: "4000m"       # Burst to 4 vCPUs for peak ingestion (10k events/sec)
        memory: "8Gi"

    # ─── JVM ─────────────────────────────────────────────────────────────────────
    jvmOptions:
      -Xms: "2048m"
      -Xmx: "4096m"
      gcLoggingEnabled: true

    # ─── Readiness / Liveness ────────────────────────────────────────────────────
    readinessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 10
      periodSeconds: 15
    livenessProbe:
      initialDelaySeconds: 45
      timeoutSeconds: 10
      periodSeconds: 15

    # ─── Pod Disruption Budget ────────────────────────────────────────────────────
    # At most 1 broker unavailable at a time (ensures min.insync.replicas=2 is met)
    template:
      pod:
        terminationGracePeriodSeconds: 120
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
        affinity:
          # Spread brokers across different nodes to survive node failure
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: strimzi.io/cluster
                      operator: In
                      values:
                        - railos-kafka
                    - key: strimzi.io/kind
                      operator: In
                      values:
                        - Kafka
                topologyKey: kubernetes.io/hostname
        tolerations: []   # Add node taints here if Kafka nodes are tainted

    # ─── Metrics (Prometheus) ────────────────────────────────────────────────────
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: railos-kafka-metrics
          key: kafka-metrics-config.yml

  # ─── ZooKeeper ───────────────────────────────────────────────────────────────
  # Used for Kafka 3.7 (KRaft mode is optional; use KRaft manifest variant for
  # Kafka 3.8+ when ZooKeeper removal is desired).
  zookeeper:
    replicas: 3
    image: quay.io/strimzi/kafka:0.40.0-kafka-3.7.0

    storage:
      type: persistent-claim
      size: 20Gi
      class: standard
      deleteClaim: false

    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

    jvmOptions:
      -Xms: "512m"
      -Xmx: "512m"

    readinessProbe:
      initialDelaySeconds: 20
      timeoutSeconds: 5
      periodSeconds: 10
    livenessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 5
      periodSeconds: 15

    template:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: strimzi.io/cluster
                      operator: In
                      values:
                        - railos-kafka
                    - key: strimzi.io/kind
                      operator: In
                      values:
                        - ZooKeeper
                topologyKey: kubernetes.io/hostname

    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: railos-kafka-metrics
          key: zookeeper-metrics-config.yml

  # ─── Entity Operator ─────────────────────────────────────────────────────────
  # The Entity Operator manages KafkaTopic and KafkaUser CRs automatically.
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
    userOperator:
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

---
# ─── Prometheus Metrics ConfigMap ────────────────────────────────────────────────
# JMX Prometheus Exporter rules for Kafka and ZooKeeper metrics.
# Consumed by Grafana/Prometheus in the RailOS observability stack (Req 17, Req 25).
apiVersion: v1
kind: ConfigMap
metadata:
  name: railos-kafka-metrics
  namespace: railos
  labels:
    app.kubernetes.io/part-of: railos-pilot
data:
  kafka-metrics-config.yml: |
    # Kafka Broker JMX metrics for Prometheus
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      # Broker messages in/out rate
      - pattern: kafka.server<type=BrokerTopicMetrics, name=(MessagesInPerSec|BytesInPerSec|BytesOutPerSec), topic=(.+)><>(Count|OneMinuteRate)
        name: kafka_server_brokertopicmetrics_$1_$3
        labels:
          topic: $2
      # Under-replicated partitions (critical for RF=3 health)
      - pattern: kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value
        name: kafka_server_replicamanager_underreplicatedpartitions
      # Active controller count (should always be 1)
      - pattern: kafka.controller<type=KafkaController, name=ActiveControllerCount><>Value
        name: kafka_controller_kafkacontroller_activecontrollercount
      # Offline partitions (should always be 0 in healthy cluster)
      - pattern: kafka.controller<type=KafkaController, name=OfflinePartitionsCount><>Value
        name: kafka_controller_kafkacontroller_offlinepartitionscount
      # Request latency
      - pattern: kafka.network<type=RequestMetrics, name=TotalTimeMs, request=(.+)><>(Mean|99thPercentile)
        name: kafka_network_requestmetrics_totaltimems_$2
        labels:
          request: $1
      # Log flush latency
      - pattern: kafka.log<type=LogFlushStats, name=LogFlushRateAndTimeMs><>(Count|Mean)
        name: kafka_log_logflushstats_$1
      # ISR shrink/expand
      - pattern: kafka.server<type=ReplicaManager, name=(IsrShrinksPerSec|IsrExpandsPerSec)><>(Count|OneMinuteRate)
        name: kafka_server_replicamanager_$1_$2
      # Consumer lag (via JMX)
      - pattern: kafka.server<type=FetcherLagMetrics, name=ConsumerLag, clientId=(.+), topic=(.+), partition=(.+)><>Value
        name: kafka_server_fetcherlagmetrics_consumerlag
        labels:
          client_id: $1
          topic: $2
          partition: $3

  zookeeper-metrics-config.yml: |
    # ZooKeeper JMX metrics for Prometheus
    lowercaseOutputName: true
    rules:
      - pattern: "org.apache.ZooKeeperService<name0=ReplicatedServer_id(\\d+)><>(\\w+)"
        name: "zookeeper_$2"
        labels:
          replicaId: $1
      - pattern: "org.apache.ZooKeeperService<name0=ReplicatedServer_id(\\d+), name1=replica.(\\d+)><>(\\w+)"
        name: "zookeeper_$3"
        labels:
          replicaId: $2
      - pattern: "org.apache.ZooKeeperService<name0=StandaloneServer_port(\\d+)><>(\\w+)"
        name: "zookeeper_$2"
