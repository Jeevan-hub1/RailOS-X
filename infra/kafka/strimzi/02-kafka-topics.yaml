---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: vision-defect-gradcam
  namespace: railos
  labels:
    strimzi.io/cluster: railos-kafka
    app.kubernetes.io/part-of: railos-pilot
    topic-category: artifacts
spec:
  partitions: 3
  replicas: 3
  topicName: vision.defect.gradcam
  config:
    min.insync.replicas: "2"
    retention.ms: "604800000"
    # Grad-CAM heatmaps are larger; use snappy for better ratio
    compression.type: "snappy"
    cleanup.policy: "delete"
    # Larger max message size for heatmap payloads
    max.message.bytes: "10485760"   # 10 MiB

