---
# RailOS Kafka Topics — all topics from Design §4.1
#
# Every topic uses:
#   replication.factor: 3  (matches cluster RF=3)
#   min.insync.replicas: 2 (matches cluster mir=2)
#
# Partition counts are sized for the 10,000 events/sec throughput requirement
# (Req 1 C6). High-volume sensor topics get more partitions; low-volume
# advisory/audit topics use fewer partitions.
#
# Apply: kubectl apply -f 02-kafka-topics.yaml -n railos

# ─── Sensor Topics ──────────────────────────────────────────────────────────────

apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: track-sensor-vibration
  namespace: railos
  labels:
    strimzi.io/cluster: railos-kafka
    app.kubernetes.io/part-of: railos-pilot
    topic-category: sensor
spec:
  partitions: 12
  replicas: 3
  topicName: track.sensor.vibration
  config:
    min.insync.replicas: "2"
    retention.ms: "604800000"       # 7 days (raw events archived to InfluxDB within 90d)
    compression.type: "lz4"
    cleanup.policy: "delete"

