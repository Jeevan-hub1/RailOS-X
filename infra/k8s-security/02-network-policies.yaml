---
# Default deny-all — all ingress and egress blocked unless explicitly allowed.
# Every NetworkPolicy below opens specific ports for specific pod selectors.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: railos
  labels:
    app.kubernetes.io/part-of: railos-pilot
spec:
  podSelector: {}    # applies to ALL pods in railos namespace
  policyTypes:
    - Ingress
    - Egress

---
# Allow DNS resolution (UDP/TCP 53) for all pods — required for service discovery.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: railos
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# Allow all pods in railos namespace to reach Kafka brokers (9092 plaintext, 9093 TLS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-internal
  namespace: railos
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP

---
# Allow Kafka pods to receive connections from any pod in railos namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-ingress
  namespace: railos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: railos-pilot
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP

---
# Allow all pods to reach InfluxDB (port 8086)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-influxdb
  namespace: railos
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: influxdb
      ports:
        - port: 8086
          protocol: TCP

---
# Allow all pods to reach PostgreSQL Patroni cluster (port 5432)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql
  namespace: railos
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: postgis
      ports:
        - port: 5432
          protocol: TCP

---
# Allow Kong to reach Keycloak for JWKS endpoint (port 8080)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-jwks
  namespace: railos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kong
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - port: 8080
          protocol: TCP
        - port: 9000
          protocol: TCP

---
# Allow all services to reach MinIO (port 9000 API, 9001 console)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio
  namespace: railos
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - port: 9000
          protocol: TCP
        - port: 9001
          protocol: TCP

---
# Allow all services to reach Vault (port 8200)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault
  namespace: railos
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - port: 8200
          protocol: TCP

---
# Allow Prometheus (in railos-monitoring) to scrape all pods in railos namespace
# on standard metrics ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: railos
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: railos-monitoring
      ports:
        - port: 9090    # Prometheus self
          protocol: TCP
        - port: 9404    # Kafka JMX exporter
          protocol: TCP
        - port: 9187    # postgres_exporter
          protocol: TCP
        - port: 5000    # MLflow
          protocol: TCP
        - port: 8001    # Kong admin
          protocol: TCP
        - port: 8080    # Keycloak
          protocol: TCP
        - port: 9000    # Keycloak management / Vault metrics
          protocol: TCP
        - port: 8200    # Vault
          protocol: TCP
        - port: 2020    # Fluent Bit
          protocol: TCP

---
# Allow Kong proxy ingress from outside (ingress controller / load balancer)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kong-proxy-ingress
  namespace: railos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kong
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
        - port: 8443
          protocol: TCP

---
# Allow Flink jobmanager <-> taskmanager cluster communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-flink-cluster-internal
  namespace: railos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flink
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flink
      ports:
        - port: 6123    # JobManager RPC
          protocol: TCP
        - port: 6124    # JobManager blob
          protocol: TCP
        - port: 8081    # JobManager REST
          protocol: TCP
        - port: 6122    # TaskManager RPC
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flink
      ports:
        - port: 6123
          protocol: TCP
        - port: 6124
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 6122
          protocol: TCP
