---
# Delta Lake Init — Secrets Template
#
# Replace all REPLACE_WITH_* values before deploying.
# In production, inject these via HashiCorp Vault Agent Injector or
# External Secrets Operator (same pattern as infra/minio/01-secrets.yaml).
# Do NOT commit real credentials to source control.
#
# Satisfies:
#   - Design §4.2:   Delta Lake on S3-compatible object store (MinIO)
#   - Design §9.3:   Credentials not embedded in manifests (Req 39)
#   - Req 1 C4:      Storage layer for sensor event archival after 90-day InfluxDB retention
apiVersion: v1
kind: Secret
metadata:
  name: delta-lake-init-secrets
  namespace: railos
  labels:
    app.kubernetes.io/name: delta-lake-init
    app.kubernetes.io/component: storage-init
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
stringData:
  # MinIO / S3A credentials for the PySpark init job.
  # These should map to the MINIO_INIT_ACCESS_KEY / MINIO_INIT_SECRET_KEY from
  # infra/minio/01-secrets.yaml, or a dedicated Delta Lake service-account key
  # with write access to s3a://railos-delta-lake/ only.
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_MINIO_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_MINIO_SECRET_KEY"
