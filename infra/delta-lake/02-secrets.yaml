---
# RailOS Delta Lake — MinIO credentials for Spark S3A connector
# In production: inject via HashiCorp Vault (Task 1.9 / Task 21.4)
# These are placeholder values — replace before deployment.
apiVersion: v1
kind: Secret
metadata:
  name: delta-lake-minio-creds
  namespace: railos
  labels:
    app.kubernetes.io/name: delta-lake
    app.kubernetes.io/part-of: railos-pilot
type: Opaque
stringData:
  # MinIO service account with read/write access to railos-delta-lake bucket
  MINIO_ACCESS_KEY: "railos-delta-user"
  MINIO_SECRET_KEY: "CHANGE_ME_BEFORE_DEPLOY"
