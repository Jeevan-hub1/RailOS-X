---
# RailOS Delta Lake — Spark/S3A configuration ConfigMap
# Referenced by the init Job and future compaction CronJobs (Task 4.9)
apiVersion: v1
kind: ConfigMap
metadata:
  name: delta-lake-config
  namespace: railos
  labels:
    app.kubernetes.io/name: delta-lake
    app.kubernetes.io/part-of: railos-pilot
data:
  # MinIO endpoint (S3A)
  MINIO_ENDPOINT: "http://minio.railos.svc.cluster.local:9000"
  DELTA_BUCKET: "railos-delta-lake"

  # Spark submit extra jars injected at runtime from /opt/spark/jars
  SPARK_EXTRA_PACKAGES: "io.delta:delta-spark_2.12:3.2.0"

  # spark-defaults.conf mounted by init/compaction pods
  spark-defaults.conf: |
    # Delta Lake extensions
    spark.sql.extensions                       io.delta.sql.DeltaSparkSessionExtension
    spark.sql.catalog.spark_catalog            org.apache.spark.sql.delta.catalog.DeltaCatalog

    # S3A / MinIO
    spark.hadoop.fs.s3a.path.style.access      true
    spark.hadoop.fs.s3a.impl                   org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.connection.ssl.enabled false
    spark.hadoop.fs.s3a.fast.upload            true
    spark.hadoop.fs.s3a.multipart.size         67108864

    # Delta retention (matches RailOS retention policies)
    spark.databricks.delta.logRetentionDuration    interval 365 days
    spark.databricks.delta.deletedFileRetentionDuration  interval 30 days

    # Schema evolution allowed for forward-compatibility
    spark.databricks.delta.schema.autoMerge.enabled  true

    # Shuffle partitions (tuned for zone compute GPU server)
    spark.sql.shuffle.partitions               32
    spark.default.parallelism                  32
