---
# RailOS Maintenance Engine — ConfigMap (Task 7.6)
# Satisfies: Req 4, Design §6.2, §9.3
apiVersion: v1
kind: ConfigMap
metadata:
  name: maintenance-engine-config
  namespace: railos
  labels:
    app: maintenance-engine
    component: predictive-maintenance
    version: "1.0.0"
data:
  # Path to the serialised MaintenanceLSTM state-dict (mounted via PVC)
  MODEL_PATH: "/models/maintenance_lstm_v1.0.0.pt"

  # Kafka bootstrap servers (Strimzi-managed cluster in railos namespace)
  KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-kafka-bootstrap.railos:9092"

  # Failure probability threshold for emitting a MAINTENANCE_ADVISORY event
  FAILURE_THRESHOLD: "0.80"

  # Semantic version of the deployed model — logged on every advisory
  MODEL_VERSION: "1.0.0"

  # Prometheus metrics scrape port
  PROMETHEUS_PORT: "9090"

  # Kafka topics
  FEATURES_TOPIC: "train.features.maintenance"
  ADVISORIES_TOPIC: "maintenance.advisories"

  # Horizon hours published in every MAINTENANCE_ADVISORY
  HORIZON_HOURS: "72"

  # Log level (DEBUG | INFO | WARNING | ERROR)
  LOG_LEVEL: "INFO"
