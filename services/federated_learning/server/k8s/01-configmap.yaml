apiVersion: v1
kind: ConfigMap
metadata:
  name: fl-server-config
  namespace: railos-fl
  labels:
    app: fl-server
    component: federated-learning
data:
  FL_SERVER_HOST: "0.0.0.0"
  FL_SERVER_PORT: "8080"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-headless.railos-kafka.svc.cluster.local:9092"
  MIN_CLIENTS: "3"
  ROUND_TIMEOUT: "120"
  FL_ROUNDS: "10"
  METRICS_PORT: "8000"
  QUALITY_TOLERANCE: "0.01"
