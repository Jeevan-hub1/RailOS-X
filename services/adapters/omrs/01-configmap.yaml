apiVersion: v1
kind: ConfigMap
metadata:
  name: omrs-adapter-config
  namespace: railos
  labels:
    app: omrs-adapter
    component: legacy-adapter
data:
  OMRS_HOST: "omrs-stream.railos.svc.cluster.local"
  OMRS_PORT: "9001"
  KAFKA_BOOTSTRAP_SERVERS: "railos-kafka-kafka-bootstrap.railos.svc.cluster.local:9092"
  ADAPTER_VERSION: "1.0.0"
  METRICS_PORT: "8080"
  RECONNECT_DELAY_SECONDS: "5"
