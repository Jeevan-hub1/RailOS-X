apiVersion: v1
kind: ConfigMap
metadata:
  name: wild-adapter-config
  namespace: railos
  labels:
    app: wild-adapter
    component: legacy-adapter
data:
  WILD_HOST: "wild-stream.railos.svc.cluster.local"
  WILD_PORT: "9002"
  KAFKA_BOOTSTRAP_SERVERS: "railos-kafka-kafka-bootstrap.railos.svc.cluster.local:9092"
  ADAPTER_VERSION: "1.0.0"
  METRICS_PORT: "8080"
  RECONNECT_DELAY_SECONDS: "5"
